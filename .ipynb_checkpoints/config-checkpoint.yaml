project:
  name: "house_price_quantile_regression"
  random_seed: 42
  n_jobs: 4  # 使用所有CPU核心

data:
  train_test_split: 0.2
  quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
  target: "總價元"

paths:
  data_dir: "./data"
  model_dir: "./models"
  result_dir: "./results"

hyperparameter_tuning:
  n_trials: 100
  cv_folds: 5
  timeout: null  # 1小時

models:
  xgboost:
    n_estimators_range: [100, 500]
    max_depth_range: [3, 10]
    learning_rate_range: [0.01, 0.3]
    subsample_range: [0.6, 1.0]
    colsample_bytree_range: [0.6, 1.0]
    
  random_forest:
    n_estimators_range: [100, 500]
    max_depth_range: [5, 30]
    min_samples_split_range: [2, 20]
    min_samples_leaf_range: [1, 10]
    
  lightgbm:
    n_estimators_range: [100, 500]
    max_depth_range: [3, 10]
    learning_rate_range: [0.01, 0.3]
    num_leaves_range: [20, 100]
    subsample_range: [0.6, 1.0]
    
  # ========================================
  # 神經網路模型配置（NN / DNN / CNN）
  # ========================================
  
  nn:
    description: "Simple NN - baseline model"
    default_units_1: 64
    default_units_2: 32
    default_dropout_1: 0.2
    default_dropout_2: 0.2
    batch_size: 32
    epochs: 100
    patience: 20
    learning_rate: 0.001
    
  dnn:
    description: "Deep NN with skip connection"
    default_units: [256, 128, 64, 32]
    default_dropout_base: 0.3
    use_batch_norm: true
    batch_size: 64
    epochs: 100
    patience: 20
    learning_rate: 0.001
    
  cnn:
    description: "1D CNN for tabular data"
    default_conv_filters: [64, 128, 64]
    default_conv_dropout: 0.2
    default_dense_units: [128, 64]
    default_dense_dropout_1: 0.3
    default_dense_dropout_2: 0.2
    kernel_size: 3
    batch_size: 64
    epochs: 100
    patience: 20
    learning_rate: 0.001